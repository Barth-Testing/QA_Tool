<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Dashboard Prototype</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-brand">
      <span class="navbar-logo">◆</span>
      <h1 class="navbar-title">QA Dashboard</h1>
    </div>
    <nav class="navbar-tabs">
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="values">Werte</button>
    </nav>
    <div class="navbar-center">
      <select id="dashboard-select" class="dashboard-select"></select>
    </div>
    <div class="navbar-actions">
      <button id="btn-catalog" class="btn btn-primary dashboard-only">+ KPI hinzufügen</button>
      <button id="btn-columns" class="btn btn-secondary dashboard-only">Spalten</button>
      <button id="btn-export" class="btn btn-secondary">Export</button>
    </div>
  </header>

  <main class="dashboard-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Testkampagnen</h2>
        <button id="btn-add-campaign" class="btn btn-primary btn-sm" title="Neue Testkampagne">+</button>
      </div>
      <div class="sidebar-list" id="campaign-list"></div>
    </aside>
    <div class="dashboard-main">
      <div id="dashboard-grid" class="dashboard-grid"></div>
      <div id="values-tab" class="values-tab hidden">
        <div class="values-header">
          <h2>KPI-Werte bearbeiten</h2>
          <div class="values-header-actions">
            <button id="btn-download-values" class="btn btn-primary">Als JSON herunterladen</button>
          </div>
        </div>
        <p class="values-info">Werte beziehen sich auf KPIs des aktuell ausgewählten Dashboards. Änderungen werden sofort übernommen.</p>
        <div id="values-form" class="values-form"></div>
      </div>
    </div>

  <div id="campaign-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content campaign-modal-content">
      <div class="modal-header">
        <h2>Neue Testkampagne</h2>
        <button id="btn-close-campaign" class="btn-close">&times;</button>
      </div>
      <div class="campaign-form">
        <label for="campaign-version">Version</label>
        <input type="text" id="campaign-version" placeholder="z.B. 4.4.1">
        <button id="btn-create-campaign" class="btn btn-primary">Erstellen</button>
      </div>
    </div>
  </div>

  <div id="catalog-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content catalog-modal">
      <div class="modal-header">
        <h2>KPI-Katalog</h2>
        <button id="btn-close-catalog" class="btn-close">&times;</button>
      </div>
      <div class="catalog-toolbar">
        <input type="text" id="catalog-search" class="catalog-search" placeholder="KPIs durchsuchen...">
        <div class="catalog-filters">
          <button class="filter-btn active" data-filter="all">Alle</button>
          <button class="filter-btn" data-filter="dev">Dev</button>
          <button class="filter-btn" data-filter="ops">Ops</button>
        </div>
      </div>
      <div id="catalog-list" class="catalog-list"></div>
    </div>
  </div>

  <div id="column-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content column-modal">
      <div class="modal-header">
        <h2>Spaltenanzahl anpassen</h2>
        <button id="btn-close-columns" class="btn-close">&times;</button>
      </div>
      <div class="column-control">
        <label for="column-slider">Spalten: <span id="column-value">4</span></label>
        <input type="range" id="column-slider" min="2" max="8" value="4">
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/charts.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
